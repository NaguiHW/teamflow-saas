name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @teamflow/api test

      - name: Component tests
        run: pnpm --filter @teamflow/web test:components

      - name: Critical coverage
        run: pnpm --filter @teamflow/web test:coverage

      - name: Install Playwright browser
        run: pnpm --filter @teamflow/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @teamflow/web test:e2e

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
